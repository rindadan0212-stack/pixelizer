[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # ⚠️ X-Frame-Options = "DENY" は itch.io の埋め込みまで塞ぐ。
    # frame-ancestors なら「自分と itch.io だけ許す」と書ける (こちらが優先)。
    Content-Security-Policy = "frame-ancestors 'self' https://itch.io https://*.itch.io https://html.itch.zone"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "interest-cohort=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# サービスワーカーは絶対にキャッシュさせない。
# 古いものが居座ると、更新しても中身が入れ替わらなくなる。
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"
